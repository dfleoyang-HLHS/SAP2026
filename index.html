<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
</head>
<body>
<title>數位前導指南診斷</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 版面：頂部固定四步驟列，主欄 1080px；盤點卡片採「代碼欄＋內文＋狀態列」三段，對應原指南七欄表的閱讀順序 */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#e9edf2; --ink:#18212c; --muted:#596677; --line:#d5dce5;
  --accent:#1f4e8c; --accent-soft:#e3ebf6; --mark:#b3261e;
  --done:#2c7a4b; --part:#b06f12; --no:#b3261e; --tbd:#6a4ea3; --na:#8892a0;
  --kr:#1f4e8c; --ec:#16727a; --sl:#3c7a2c; --tt:#a85a12; --as:#6a4ea3;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#19202a; --sunk:#222b37; --ink:#e4e9ef; --muted:#9ba7b6; --line:#2e3946;
  --accent:#86ade8; --accent-soft:#1f2c40; --mark:#f08a80;
  --done:#5cbf84; --part:#e0a548; --no:#f08a80; --tbd:#b39ae6; --na:#7d8796;
  --kr:#86ade8; --ec:#5cc0c8; --sl:#86c46f; --tt:#e5a160; --as:#b39ae6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#19202a; --sunk:#222b37; --ink:#e4e9ef; --muted:#9ba7b6; --line:#2e3946;
  --accent:#86ade8; --accent-soft:#1f2c40; --mark:#f08a80;
  --done:#5cbf84; --part:#e0a548; --no:#f08a80; --tbd:#b39ae6; --na:#7d8796;
  --kr:#86ade8; --ec:#5cc0c8; --sl:#86c46f; --tt:#e5a160; --as:#b39ae6; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.35;margin:0}
h1{font-size:1.6rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}

/* 頂部 */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--f-display);font-size:1.08rem}
.brand span{font-size:.8rem;color:var(--muted)}
nav.steps{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.steps button{border:1px solid transparent;background:none;padding:6px 12px;border-radius:999px;color:var(--muted);display:flex;gap:6px;align-items:center}
nav.steps button .n{font-family:var(--f-mono);font-size:.78rem;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
nav.steps button[aria-current="step"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
nav.steps button[aria-current="step"] .n{background:var(--accent);color:var(--surface);border-color:var(--accent)}

main{padding-block:28px 64px}
section.view{display:grid;gap:22px}
.lede{max-width:65ch;color:var(--muted)}
.banner{border:1px dashed var(--part);background:color-mix(in srgb,var(--part) 9%,var(--surface));padding:10px 14px;border-radius:var(--r);display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.label{font-size:.78rem;letter-spacing:.08em;color:var(--muted);font-weight:500}

/* 方案選擇 */
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.choice button{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.choice button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice button b{font-family:var(--f-display);font-size:1.05rem}
.choice button span{font-size:.86rem;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:500}
.field{display:grid;gap:6px}
input[type=text],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;min-width:0;width:100%}
textarea{resize:vertical}

.dimlegend{display:grid;gap:8px}
.dimlegend div{display:flex;gap:10px;align-items:baseline}
.chip{font-family:var(--f-mono);font-size:.74rem;padding:1px 7px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.d-KR{color:var(--kr)} .d-EC{color:var(--ec)} .d-SL{color:var(--sl)} .d-TT{color:var(--tt)} .d-AS{color:var(--as)}
.law{border-left:3px solid var(--mark);padding:2px 0 2px 12px}
ol.flow{margin:0;padding-left:1.3em;display:grid;gap:6px}

.btnrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);padding:8px 18px;border-radius:var(--r);font-weight:500}
.btn.ghost{background:var(--surface);color:var(--accent)}
.btn.quiet{border-color:var(--line);background:var(--surface);color:var(--ink);font-weight:400}

/* 盤點 */
.stagetabs{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--line)}
.stagetabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px 8px;display:grid;gap:2px;text-align:left;white-space:nowrap;color:var(--muted)}
.stagetabs button b{font-family:var(--f-display);color:var(--ink);font-size:.98rem}
.stagetabs button[aria-selected="true"]{border-bottom-color:var(--accent)}
.stagetabs button[aria-selected="true"] b{color:var(--accent)}
.stagetabs .bar{height:3px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:4px}
.stagetabs .bar i{display:block;height:100%;background:var(--accent)}
.stagehead{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
@media (max-width:640px){.stagehead{grid-template-columns:1fr}}
.qs{margin:0;padding-left:1.2em;display:grid;gap:4px;color:var(--muted)}
.progress{font-family:var(--f-mono);font-size:.9rem;text-align:right}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:.88rem}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.dimgroup{display:grid;gap:10px}
.dimgroup>h3{display:flex;gap:10px;align-items:center;font-size:1rem;padding-top:6px}
.item{display:grid;grid-template-columns:92px 1fr;gap:4px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;border-left:4px solid var(--line)}
.item[data-s="done"]{border-left-color:var(--done)} .item[data-s="part"]{border-left-color:var(--part)}
.item[data-s="no"]{border-left-color:var(--no)} .item[data-s="tbd"]{border-left-color:var(--tbd)} .item[data-s="na"]{border-left-color:var(--na);opacity:.75}
.item .code{font-family:var(--f-mono);font-size:.86rem;padding-top:2px}
.item .code small{display:block;font-family:var(--f-body);color:var(--muted);font-size:.76rem}
.item .body{display:grid;gap:6px;min-width:0}
.item .t{font-weight:500}
.item .nt{color:var(--muted);font-size:.9rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.74rem;padding:0 7px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.tag.new{background:color-mix(in srgb,var(--mark) 12%,var(--surface));color:var(--mark)}
.tag.g{background:var(--accent-soft);color:var(--accent)}
.tag.opt{border:1px dashed var(--muted);background:none}
.status{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:4px}
.status button{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:2px 10px;font-size:.86rem}
.status button[aria-pressed="true"][data-v="done"]{background:var(--done);border-color:var(--done);color:var(--surface)}
.status button[aria-pressed="true"][data-v="part"]{background:var(--part);border-color:var(--part);color:var(--surface)}
.status button[aria-pressed="true"][data-v="no"]{background:var(--no);border-color:var(--no);color:var(--surface)}
.status button[aria-pressed="true"][data-v="tbd"]{background:var(--tbd);border-color:var(--tbd);color:var(--surface)}
.status button[aria-pressed="true"][data-v="na"]{background:var(--na);border-color:var(--na);color:var(--surface)}
.status .addnote{margin-left:auto;background:none;border:0;color:var(--accent);font-size:.84rem}
.item textarea{grid-column:2;font-size:.88rem}
@media (max-width:560px){.item{grid-template-columns:1fr}.status,.item textarea{grid-column:1}}
details.refs summary{cursor:pointer;color:var(--accent)}
details.refs ul{margin:8px 0 0;padding-left:1.2em;display:grid;gap:2px;font-size:.88rem;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* 診斷 */
.verdict{display:grid;gap:8px;padding:20px;border-radius:var(--r);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line))}
.verdict .big{font-family:var(--f-display);font-size:1.45rem}
.tablebox{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:4px;width:100%;min-width:620px;font-variant-numeric:tabular-nums}
table.heat th{font-weight:500;font-size:.85rem;color:var(--muted);text-align:left;padding:4px 6px}
table.heat td{border-radius:4px;padding:8px 10px;text-align:center;font-family:var(--f-mono);font-size:.92rem;background:var(--sunk)}
table.heat td small{display:block;font-family:var(--f-body);font-size:.72rem;color:var(--muted)}
table.heat th.st b{display:block;font-family:var(--f-display);color:var(--ink);font-size:.95rem}
.pill{display:inline-block;font-size:.76rem;padding:1px 9px;border-radius:999px;border:1px solid currentColor;font-family:var(--f-body)}
.v-stable{color:var(--done)} .v-progress{color:var(--part)} .v-start{color:var(--no)} .v-unrated{color:var(--tbd)} .v-na{color:var(--na)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.dimbars{display:grid;gap:10px}
.dimbar{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;font-size:.9rem}
.dimbar .track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden;display:flex}
.dimbar .track i{display:block;height:100%}
.dimbar .pct{font-family:var(--f-mono);text-align:right}

/* 方案 */
.sug{display:grid;gap:8px}
.sugitem{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.sugitem input{margin-top:5px;width:18px;height:18px;accent-color:var(--accent)}
.sugitem .nt{color:var(--muted);font-size:.88rem}
.sugitem label{display:grid;gap:2px;cursor:pointer;min-width:0}
.counter{font-family:var(--f-mono)}
.counter.warn{color:var(--mark)}
.planrow{display:grid;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface)}
.planrow .head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.planrow .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.planrow .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:.85rem}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
#copyout{font-family:var(--f-mono);font-size:.82rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:8px 18px;border-radius:999px;font-size:.9rem;z-index:20}
@media (prefers-reduced-motion:no-preference){.item,.sugitem{transition:border-color .15s}}

/* 共用紀錄 */
.sync{font-size:.8rem;display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--na)}
.sync.on i{background:var(--done)} .sync.local i{background:var(--part)} .sync.ro i{background:var(--tbd)}
.schools{display:flex;flex-wrap:wrap;gap:8px}
.schools button{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 14px;text-align:left;display:grid;gap:0}
.schools button small{color:var(--muted);font-size:.78rem}
.schools button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.newschool{display:flex;gap:8px;flex-wrap:wrap}
.newschool input{flex:1 1 220px;width:auto}
.who{grid-column:2;font-size:.78rem;color:var(--muted)}
@media (max-width:560px){.who{grid-column:1}}
.app-ro .status button[data-v],.app-ro .addnote{pointer-events:none;opacity:.55}
.people{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.88rem}
.people span{display:inline-flex;gap:6px;align-items:center}
.people img{width:22px;height:22px;border-radius:50%}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><b>數位前導指南診斷</b><span id="brandsub">混成學習 α-1・跨校遠距共授 α-2｜實施指南 2.0 討論版</span></div>
  <span class="sync" id="sync"><i></i><span>連線中</span></span>
  <nav class="steps" id="steps" aria-label="步驟"></nav>
</div></header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
const DATA = {"a1":[{"n":0,"items":[{"code":"KR-0-1","dim":"KR","title":"數位科技融入教學、數位學習議題納入教師社群討論、啟動進行數位學習課程與教學設計之準備。","note":"並依各面向盤點學校現況，選定本學年優先改善項目與預期成果。","new":false,"gamma":[],"cites":[],"key":"KR-0-1"},{"code":"EC-0-1","dim":"EC","title":"建置單槍投影機、電子白板或智慧大屏。","note":"","new":false,"gamma":[],"cites":[],"key":"EC-0-1"},{"code":"EC-0-2","dim":"EC","title":"提供電腦、筆記型電腦...等3C載具。","note":"依教學與學習需求盤點載具數量、設備狀態及借用需求。","new":false,"gamma":[],"cites":[],"key":"EC-0-2"},{"code":"EC-0-3","dim":"EC","title":"建置基礎的網路設備。","note":"檢核教學區WiFi覆蓋及多載具同時連線需求，於開學前完成帳號登入與認證測試。","new":false,"gamma":[],"cites":[],"key":"EC-0-3"},{"code":"SL-0-1","dim":"SL","title":"學生具備使用數位科技的基本能力，如：能熟悉電腦、載具、文書軟體、帳號登入等資訊軟硬體的基本操作。","note":"","new":false,"gamma":[],"cites":[],"key":"SL-0-1"},{"code":"SL-0-2","dim":"SL","title":"學生透過教學簡報或影片等多媒體進行學習。","note":"","new":false,"gamma":[],"cites":[],"key":"SL-0-2"},{"code":"SL-0-3","dim":"SL","title":"學生課堂上有機會使用互動軟體進行學習。","note":"","new":false,"gamma":[],"cites":[],"key":"SL-0-3"},{"code":"SL-0-4","dim":"SL","title":"學生認識數位學習及AI使用的基本約定，知道個人資料保護、資訊查證與遇到問題時的求助方式。","note":"","new":true,"gamma":[],"cites":["4-5；4-6"],"key":"SL-0-4"},{"code":"TT-0-1","dim":"TT","title":"教師具備使用數位科技的基本能力，如：能熟悉電腦、載具、文書軟體、帳號登入等資訊軟硬體的基本操作。","note":"","new":false,"gamma":[],"cites":[],"key":"TT-0-1"},{"code":"TT-0-2","dim":"TT","title":"透過教學軟體(如簡報投影片、影片或動畫)或科技設備輔助教學。","note":"","new":false,"gamma":[],"cites":[],"key":"TT-0-2"},{"code":"TT-0-3","dim":"TT","title":"教師能依學生學習需求辨識適用的數位工具，認識AI生成內容的限制，查核教材內容後採用。","note":"","new":true,"gamma":[],"cites":["4-4，頁67至68；4-5，第1、2點"],"key":"TT-0-3"},{"code":"AS-0-1","dim":"AS","title":"學校辦理或提供教師數位融入教學的專業增能。","note":"依教師先備能力與需求安排基礎操作、數位素養及AI基本素養支持。","new":false,"gamma":[],"cites":[],"key":"AS-0-1"},{"code":"AS-0-2","dim":"AS","title":"學校建置數位融入教學的學習環境。","note":"","new":false,"gamma":[],"cites":[],"key":"AS-0-2"},{"code":"AS-0-3","dim":"AS","title":"與師長、家長及學生共同訂定以學習為核心且可執行之載具使用及借用規範。","note":"並共同訂定基本AI使用約定，涵蓋使用情境、查證、成果揭露、個資保護及求助管道。使用AI前確認工具適齡、帳號條件及家長知情與同意機制。 [],"cites":[],"key":"AS-1-2"},{"code":"AS-1-3","dim":"AS","title":"協助教師增能以熟悉平臺的操作與功能、合作學習與差異化教學。","note":"依教師能力提供分階支持，結合既有社群共備與課堂實作，降低重複研習負擔。","new":false,"gamma":[],"cites":[],"key":"AS-1-3"},{"code":"AS-1-4","dim":"AS","title":"持續宣導與滾動修正有關數位學習等使用規範。","note":"涵蓋AI使用、資訊查證、成果揭露及個資保護，並蒐集實施問題作為修正依據。","new":false,"gamma":[],"cites":["4-5，第5至8點"],"key":"AS-1-4"},{"code":"AS-1-5","dim":"AS","title":"維持親師溝通管道。","note":"說明數位學習與AI使用安排，以及學習資料蒐集的目的與範圍。","new":false,"gamma":[],"cites":["4-5，第5點"],"key":"AS-1-5"},{"code":"AS-1-6","dim":"AS","title":"整合既有計畫資源，確認設備維護及軟體授權的經費與責任分工，定期檢視工具使用情形。","note":"","new":true,"gamma":[],"cites":[],"key":"AS-1-6"}],"refs":[{"code":"X1-3","text":"學校能增置足夠的學生學習軟硬體設備和行動載具。"},{"code":"X1-5","text":"學校為維護數位學習平臺能列出檢核項目及時程安排。"},{"code":"X1-7","text":"學校訓練學生擔任資訊股長，協助課堂設備與網路使用問題。"},{"code":"X2-3","text":"學校能定期安排全校性數位化經驗分享，促進行政和教學團隊相同理解，建立共識基礎。"},{"code":"X2-5","text":"學校擇選數位學習平臺，並確認維護平臺穩定運作的經費來源。"},{"code":"X3-2","text":"學校行政與教學領導團隊能主動運用資源平臺、數位科技工具增進行政溝通與協調、組織管理，並能提升行政效能。"},{"code":"Y1-2","text":"學校能提供教師增能，協助教師懂得相關數位學習平臺與教學軟體之使用。"},{"code":"Y1-3","text":"學校能持續提供教師數位課程教學與評量相關增能，以利數位學習的轉化。"},{"code":"Y4-1","text":"教師能利用數位學習平臺督導學生學習進度、分派作業、提供評量與回饋。"},{"code":"Y5-1","text":"學生有足夠的數位學習資源，能進行適性與自主學習"},{"code":"Y6-1","text":"學校能提供課程或學習活動，引導學生理解數位公民(註1)應遵守的規範和行為。"},{"code":"Y6-3","text":"學生能發展數位素養，成為負責任的學習者。"},{"code":"Z1-1","text":"學校能提供教師進行數位專業增能，以即時回應個別專業學習需求。"},{"code":"Z1-2","text":"教師能透過學習社群、同儕共學有效增進數位化專業學習。"}]},{"n":2,"items":[{"code":"KR-2-1","dim":"KR","title":"至少組織2個數位社群或現有1個教師社群聚焦於課程中融入數位教學。","note":"","new":false,"gamma":[],"cites":[],"face":"教師面","key":"KR-2-1"},{"code":"KR-2-2","dim":"KR","title":"每一個數位社群應用數位科技到至少2門課程。","note":"(包含共讀教育部中小學數位教學指引3.0版)社群共同檢視課程設計、學生學習證據與教學調整，逐步形成可重用的課程模組。增讀《115年中小學教師數位與AI教學指引》相關章節。","new":false,"gamma":[],"cites":["4-4"],"face":"教師面","key":"KR-2-2"},{"code":"KR-2-3","dim":"KR","title":"校內50%學生的學習應用到數位工具。","note":"","new":false,"gamma":[],"cites":[],"face":"學生面","key":"KR-2-3"},{"code":"KR-2-4","dim":"KR","title":"校內50%行政人員會應用數位工具於行政工作組織溝通與工作減量。","note":"以作業時間、重複填報或錯誤情形等資料檢視行政減量成效。人數與比例請註明母數及計算期間。","new":false,"gamma":[],"cites":[],"face":"行政面","key":"KR-2-4"},{"code":"EC-2-1","dim":"EC","title":"數位學習平臺具備教學與評量功能(LMS)。","note":"","new":false,"gamma":[],"cites":[],"key":"EC-2-1"},{"code":"EC-2-2","dim":"EC","title":"充實數位教材、軟體、網站之課程內容和教材資源。","note":"建置可共享的校本教材、AI提示詞及教學案例，明定內容查核、更新與維護責任。","new":false,"gamma":[],"cites":["4-5，第6點"],"key":"EC-2-2"},{"code":"EC-2-3","dim":"EC","title":"數位學習平臺具問卷調查、投票和測驗等評量與回饋功能。","note":"能彙整任務表現與回饋資料，支援教師調整教學，並依學習需求提供可用的資料匯出方式。","new":false,"gamma":[],"cites":[],"key":"EC-2-3"},{"code":"SL-2-1","dim":"SL","title":"熟練運用線上學習資源，包括數位教材、軟體和影片，增強學習意願。","note":"","new":false,"gamma":[],"cites":[],"key":"SL-2-1"},{"code":"SL-2-2","dim":"SL","title":"具自行排除基礎資訊問題的技術。","note":"","new":false,"gamma":[],"cites":[],"key":"SL-2-2"},{"code":"SL-2-3","dim":"SL","title":"經常運用數位學習平臺（LMS），設定具體且可檢核的學習目標，管理學習進度，建立自學習慣，並採取減少數位分心的自我管理措施。","note":"","new":false,"gamma":[],"cites":[],"key":"SL-2-3"},{"code":"SL-2-4","dim":"SL","title":"透過線上合作與同儕互動，合作學習。","note":"能尊重不同觀點、表達學習困難並進行合作溝通。","new":false,"gamma":[],"cites":["4-6，第6點"],"key":"SL-2-4"},{"code":"SL-2-5","dim":"SL","title":"完成線上作業或測驗，能檢視學習歷程與成果，作為調整自己學習目標與策略的依據。","note":"","new":false,"gamma":[],"cites":[],"key":"SL-2-5"},{"code":"SL-2-6","dim":"SL","title":"使用AI輔助學習時，能保存必要的提示、查證與修訂紀錄，說明採用或不採用AI建議的理由。","note":"","new":true,"gamma":[],"cites":["4-4，頁45、59、68"],"key":"SL-2-6"},{"code":"TT-2-1","dim":"TT","title":"運用數位學習平臺組織教學資源，如課程包、數位教材、線上模擬軟體等，整合不同數位工具，以提升教學品質。","note":"","new":false,"gamma":[],"cites":[],"key":"TT-2-1"},{"code":"TT-2-2","dim":"TT","title":"能使用數位評估工具，如線上測驗、評分系統或共編文件，了解學生學習情形並評估學習成效。","note":"事先說明評分規準與AI使用要求，結合作品歷程、課堂表現或口頭說明確認學生理解。AI內容偵測結果僅作輔助，爭議應結合作品、歷程、學生說明與教師專業判斷。","new":false,"gamma":[],"cites":["4-5，第3點；4-7，第4條"],"key":"TT-2-2"},{"code":"TT-2-3","dim":"TT","title":"運用數位工具如Padlet、生成式AI…進行教學共備。","note":"查核AI生成教材與評量建議，並將可採用的教案與案例納入共享資源。優先使用教育版或經學校審查的環境，不以個人帳號處理學生資料或校務文件。","new":false,"gamma":[],"cites":["4-5，第1、2、5、6點"],"key":"TT-2-3"},{"code":"TT-2-4","dim":"TT","title":"以教學策略促使學生靈活轉換學習模式，如四學模式（註4）。","note":"（自學、導學、共學、互學）整合課前預習、課中互動與課後回饋，保存學生任務及修正歷程。","new":false,"gamma":[],"cites":["4-4，頁68"],"key":"TT-2-4"},{"code":"TT-2-5","dim":"TT","title":"以各種教學型態如線下與線上混成，切換不同的學習環境，以增進學習效果。","note":"","new":false,"gamma":[],"cites":[],"key":"TT-2-5"},{"code":"TT-2-6","dim":"TT","title":"營造彈性和友善的學習氛圍，和安心運用數位的學習環境。","note":"融入情緒覺察、合作溝通及負責任的決定，回應數位學習中的挫折與互動困難。","new":false,"gamma":[],"cites":[],"key":"TT-2-6"},{"code":"TT-2-7","dim":"TT","title":"成為數位公民(註1)的基本素養，營造良好的師生與生生之間的互動關係。","note":"","new":false,"gamma":[],"cites":["4-5，第8點"],"key":"TT-2-7"},{"code":"AS-2-1","dim":"AS","title":"妥善規劃混成教學計畫的實施時間與配套安排。","note":"整合數位學習、AI、SEL及自主學習的課務安排與成果回報，減少重複會議與填報。","new":false,"gamma":[],"cites":[],"key":"AS-2-1"},{"code":"AS-2-2","dim":"AS","title":"評估教師增能需求與規劃短中長期專業發展計畫，讓教師可以具備數位素養與掌握數位教學的能力。","note":"以課程設計、評量與實作共備為進階增能重點，透過觀議課及學生作品檢視轉化成效。","new":false,"gamma":[],"cites":[],"key":"AS-2-2"},{"code":"AS-2-3","dim":"AS","title":"提供教師和學生相關的教育科技培訓課程，以幫助他們熟練使用數位工具與生成式AI。","note":"","new":false,"gamma":[],"cites":["4-4，頁59、67至68"],"key":"AS-2-3"},{"code":"AS-2-4","dim":"AS","title":"成立技術支援小組，以解決教師和學生在科技使用上的問題和疑慮讓師生可以專注於教與學。","note":"明定行政與技術窗口，保存支援流程及交接紀錄。","new":false,"gamma":[],"cites":[],"key":"AS-2-4"},{"code":"AS-2-5","dim":"AS","title":"定期召開核心小組會議，依據數位學習平臺數據與資料檢視教師與學生使用數位工具教與學的問題，並提出改善策略。","note":"依資料安排課堂即時回饋、單元補救或延伸，以及社群或教研會共同檢視，並追蹤改善結果。","new":false,"gamma":[],"cites":[],"key":"AS-2-5"},{"code":"AS-2-6","dim":"AS","title":"建立數位管理與問題回報機制，讓相關技術團隊可以快速地回應並解決技術問題。","note":"","new":false,"gamma":[],"cites":[],"key":"AS-2-6"},{"code":"AS-2-7","dim":"AS","title":"建立明確而清楚的數位學習與生成式AI使用規範。","note":"依課程與評量任務細化可用範圍、揭露方式、查證、個資保護及教師審查責任。班級任務約定須銜接校級規範及必要的家長知情與同意流程。","new":false,"gamma":[],"cites":["4-5，第5至8點"],"key":"AS-2-7"},{"code":"AS-2-8","dim":"AS","title":"維持親師溝通管道","note":"","new":false,"gamma":[],"cites":[],"key":"AS-2-8"},{"code":"AS-2-9","dim":"AS","title":"由核心小組統籌或依需要設置數據治理分工，訂定資料品質、存取權限、保存期限、匯出與家長告知等規則，整合既有資料，避免重複蒐集。","note":"學習評量資料的蒐集、處理與利用，依個人資料保護法及相關法規辦理。","new":true,"gamma":[],"cites":["4-7，第29條"],"key":"AS-2-9"}],"refs":[{"code":"X2-4","text":"學校能向外進行標竿學習，加速達成「數位前導學校目標」。"},{"code":"X2-8","text":"學校能獲取並整合資源，促進行政運作數位化及科技創新。"},{"code":"X3-3","text":"學校善用校務發展數據，進行行政管理、課程教學、學生學習之評估，並以證據為本進行決策。"},{"code":"Y2-3","text":"教師能依據學科特性使用合適的軟體。"},{"code":"Y2-4","text":"發展互動式小組合作學習(例如:運用「四學」（註4）或混成學習(註3)方式，變換不同互動學習模式。"},{"code":"Y5-2","text":"學生進行自主學習時，能利用數位學習平臺紀錄學習過程並能自我檢視。"},{"code":"Z1-3","text":"教師能利用共備，持續地發展與累積數位化教材。"},{"code":"Z1-4","text":"學校能提供鼓勵機制，促進教師間協作與專業回饋。"}]},{"n":3,"items":[{"code":"KR-3-1","dim":"KR","title":"校內至少有50%的教師參與聚焦於數位科技運用的社群。","note":"","new":false,"gamma":[],"cites":[],"face":"教師面","key":"KR-3-1"},{"code":"KR-3-2","dim":"KR","title":"至少5門課程應用到數位科技且沒有集中於相同領域。","note":"跨領域社群比較課程實作與學生學習證據，確認數位融入的教學效益並提出改善措施。","new":false,"gamma":[],"cites":[],"face":"教師面","key":"KR-3-2"},{"code":"KR-3-3","dim":"KR","title":"校內70%學生的學習應用到數位科技。","note":"","new":false,"gamma":[],"cites":[],"face":"學生面","key":"KR-3-3"},{"code":"KR-3-4","dim":"KR","title":"校內80%行政人員會應用數位科技於行政工作組織溝通。","note":"人數與比例請註明母數及計算期間。","new":false,"gamma":[],"cites":[],"face":"行政面","key":"KR-3-4"},{"code":"EC-3-1","dim":"EC","title":"數位學習平臺（LMS）能追蹤學生進度，提供學生個別化建議。","note":"提供教師判讀學習差異所需的資料，個別化建議應結合教師觀察與學生回饋。","new":false,"gamma":[],"cites":[],"key":"EC-3-1"},{"code":"EC-3-2","dim":"EC","title":"數位學習平臺具調整課程內容功能，以滿足不同學生的自適應學習(註2)需求。","note":"","new":false,"gamma":[],"cites":[],"key":"EC-3-2"},{"code":"EC-3-3","dim":"EC","title":"提供線上討論區、即時聊天室等互動工具以促進師生與學生之間的合作和討論。","note":"","new":false,"gamma":[],"cites":[],"key":"EC-3-3"},{"code":"SL-3-1","dim":"SL","title":"能建構自己的學習地圖，並發展自我監控與調整學習的能力。","note":"依可檢核的目標與學習證據調整策略，辨識數位分心或過度依賴AI的情形。","new":false,"gamma":[],"cites":[],"key":"SL-3-1"},{"code":"SL-3-2","dim":"SL","title":"能決定自己的學習目標與任務，並透過使用協作工具，如共編文件、線上白板、視訊會議等，進行自學和共學。","note":"","new":false,"gamma":[],"cites":[],"key":"SL-3-2"},{"code":"SL-3-3","dim":"SL","title":"善用各種形態展現成果，如多媒體等。","note":"","new":false,"gamma":[],"cites":[],"key":"SL-3-3"},{"code":"SL-3-4","dim":"SL","title":"參與線上討論和學習社群，分享資源和經驗。","note":"","new":false,"gamma":[],"cites":[],"key":"SL-3-4"},{"code":"SL-3-5","dim":"SL","title":"利用數位學習平臺並納入生成式AI，根據個人的學習模式和進度選擇合適的教材、進度和練習。","note":"能比較AI建議與自身需求，查核內容後選用，並說明AI協助範圍與自己的判斷。","new":false,"gamma":[],"cites":["4-4，頁59、67至68；4-6，第6點"],"key":"SL-3-5"},{"code":"SL-3-6","dim":"SL","title":"使用線上的學習回饋，檢視學習過程，運用數位工具協助即時評估，根據結果調控自己學習進度。","note":"","new":false,"gamma":[],"cites":[],"key":"SL-3-6"},{"code":"SL-3-7","dim":"SL","title":"認識網路使用的權利、義務與倫理。","note":"","new":false,"gamma":[],"cites":["4-6，第4、6點"],"key":"SL-3-7"},{"code":"SL-3-8","dim":"SL","title":"發展媒體識讀的能力，能分辨事實真偽，能正確地解讀所收到的資訊並對傳播的訊息負起責任。","note":"對AI生成內容的重要主張進行來源比對，辨識錯誤與偏誤並保留修正紀錄。","new":false,"gamma":[],"cites":["4-6，第1至3點"],"key":"SL-3-8"},{"code":"TT-3-1","dim":"TT","title":"針對不同程度的學生，設計異質分組或同質分組教學，運用數位工具提供適性學習任務。","note":"結合起點診斷、任務表現及回饋調整分組與任務，AI建議由教師審查後採用。","new":false,"gamma":[],"cites":["4-4，頁45、68；4-7，第15條"],"key":"TT-3-1"},{"code":"TT-3-2","dim":"TT","title":"能運用線上與線下形成性評量蒐集學生學習情形、提供學生學習回饋，並用以規劃學生之後的學習。","note":"落實課堂即時調整、單元後補救或延伸及教研會校準，檢視介入後的學習表現。","new":false,"gamma":[],"cites":["4-7，第15條"],"key":"TT-3-2"},{"code":"TT-3-3","dim":"TT","title":"運用數位學習平臺（LMS）追蹤學生歷程、進度與成果。","note":"登入、點擊等紀錄僅反映部分參與情形，須與作品、作答或對話交叉判讀。","new":false,"gamma":[],"cites":[],"key":"TT-3-3"},{"code":"TT-3-4","dim":"TT","title":"在課程與教學設計，善用虛實整合的多樣性學習活動，包含多種互動學習方式、同步與非同步模式等，突破空間與時間限制，提供學生更具彈性的學習進度與模式。","note":"依課程目標(視情形)整合SEL、SDGs或在地探究，關注合作互動及學生反思。","new":false,"gamma":[],"cites":[],"key":"TT-3-4"},{"code":"AS-3-1","dim":"AS","title":"促進教師扮演引導者的角色，指引學生主導自己的學習和學習自我監控。","note":"","new":false,"gamma":[],"cites":[],"key":"AS-3-1"},{"code":"AS-3-2","dim":"AS","title":"提供教師和學生具可選擇數位學習資源，由其評估適合資源，以確保符合其學習目標。","note":"","new":false,"gamma":[],"cites":[],"key":"AS-3-2"},{"code":"AS-3-3","dim":"AS","title":"調整與維護數位學習與生成式AI使用規範。","note":"依課堂案例與評量結果滾動修正，並將經查核的教案、提示詞及規範案例納入校本共享庫。","new":false,"gamma":[],"cites":["4-5，第6、8點"],"key":"AS-3-3"},{"code":"AS-3-4","dim":"AS","title":"提供學生解決科技技術問題的指引。","note":"","new":false,"gamma":[],"cites":[],"key":"AS-3-4"},{"code":"AS-3-5","dim":"AS","title":"維持親師溝通管道。","note":"落實學習資料用途告知與問題回應，對外分享採必要範圍及適當去識別方式。刪除姓名不代表資料已完全匿名，仍須評估其他資訊的再辨識風險。","new":false,"gamma":[],"cites":["4-5，第5點；4-7，第29條"],"key":"AS-3-5"},{"code":"AS-3-6","dim":"AS","title":"學校行政及學科教師能發展數位學習成效評估及調整機制。","note":"(鼓勵性)整合學生作品、歷程、回饋及教學調整資料，檢視學習差異與行政效率，追蹤改善效果；維持鼓勵性質。","new":false,"gamma":[],"cites":[],"key":"AS-3-6"},{"code":"AS-3-7","dim":"AS","title":"透過跨校共備與聯合諮輔校準發展定位，安排成熟學校陪伴發展中學校，運用線上共學及必要實體實作，保存教材與工作流程。","note":"","new":true,"gamma":[],"cites":[],"key":"AS-3-7"}],"refs":[{"code":"Y3-1","text":"教師能利用數位化教材進行差異化教學設計，讓學生根據自己能力與程度進行學習。"},{"code":"Y3-2","text":"教師能善用數據回饋作為形成性評量，幫助學生學習調整。"},{"code":"Y4-2","text":"教師能利用差異化和自適應學習(註2)模式增加學生對自我管理學習的責任。"},{"code":"Y5-3","text":"學生能運用數位學習平臺擴大學習選擇機會，滿足學生探索性和適性學習。"},{"code":"Y5-4","text":"學生能善用諮詢輔導資源，增進自我了解和確認學習目標之設定。"},{"code":"Y6-2","text":"學生能透過深度討論、辯論或專題研究，理解數位公民(註1)素養的重要性並願意遵守規範。"}]},{"n":4,"items":[{"code":"KR-4-1","dim":"KR","title":"校內至少有80%的教師參與聚焦於數位科技運用的社群。","note":"","new":false,"gamma":[],"cites":[],"face":"教師面","key":"KR-4-1"},{"code":"KR-4-2","dim":"KR","title":"每個領域至少1門課程應用到數位科技。","note":"各領域持續分享可重用的課程模組及學習成效證據，檢視校本課程的擴散與改進。","new":false,"gamma":[],"cites":[],"face":"教師面","key":"KR-4-2"},{"code":"KR-4-3","dim":"KR","title":"校內85%學生的學習應用到數位科技。","note":"","new":false,"gamma":[],"cites":[],"face":"學生面","key":"KR-4-3"},{"code":"KR-4-4","dim":"KR","title":"校內95%行政人員會應用數位科技於行政工作組織溝通。","note":"人數與比例請註明母數及計算期間。","new":false,"gamma":[],"cites":[],"face":"行政面","key":"KR-4-4"},{"code":"EC-4-1","dim":"EC","title":"依師生教學與學習需求，持續評估、選用及維護教學軟體或應用程式；採購或續訂前檢視使用情形、授權條件及維運總成本，並規劃替代工具與資料移轉。","note":"","new":false,"gamma":[],"cites":["4-4，頁67至68"],"key":"EC-4-1"},{"code":"EC-4-2","dim":"EC","title":"數位學習平臺（LMS）具記錄學生學習足跡的功能，並可提供教師作為教學策略調整參考。","note":"依資料品質與權限規則提供分析及匯出，支援跨年度追蹤並保護學生資料。","new":false,"gamma":[],"cites":["4-7，第29條"],"key":"EC-4-2"},{"code":"EC-4-3","dim":"EC","title":"持續引進教育科技新知，支持學校行政與教學需求。","note":"","new":false,"gamma":[],"cites":[],"key":"EC-4-3"},{"code":"SL-4-1","dim":"SL","title":"能妥善運用線下和線上工具、管理課內和課外學習時間、並清楚自己對課程的期望與承擔學習的責任。","note":"(負責任地完成學習任務)能自主調整數位工具使用與休息節奏，降低分心並維持學習投入。","new":false,"gamma":[],"cites":[],"key":"SL-4-1"},{"code":"SL-4-2","dim":"SL","title":"能有效完成混成學習(註3)計畫中的活動，並尋找適當的資源來進行學習。","note":"","new":false,"gamma":[],"cites":[],"key":"SL-4-2"},{"code":"SL-4-3","dim":"SL","title":"善用生成式AI規劃與輔助自己的學習，反饋學習過程適度調整學習目標、策略、節奏和資源。","note":"能評估AI建議的適切性與限制，查證、修訂並揭露使用情形，保持自主判斷與學習責任。","new":false,"gamma":[],"cites":["4-4，頁59、68；4-6，第6點"],"key":"SL-4-3"},{"code":"SL-4-4","dim":"SL","title":"能運用數位科技自主學習、探究問題、分享學習、延伸學習。","note":"","new":false,"gamma":[],"cites":[],"key":"SL-4-4"},{"code":"SL-4-5","dim":"SL","title":"認識網路使用的權利、義務與倫理。","note":"","new":false,"gamma":[],"cites":[],"key":"SL-4-5"},{"code":"TT-4-1","dim":"TT","title":"能透過專業增能與社群共備，研擬提供學生完善的自主學習規劃與執行歷程。","note":"","new":false,"gamma":[],"cites":[],"key":"TT-4-1"},{"code":"TT-4-2","dim":"TT","title":"能善用教室情境、數位軟體、分組安排、與載具使用，將混成學習(註3)的效果最佳化。","note":"","new":false,"gamma":[],"cites":[],"key":"TT-4-2"},{"code":"TT-4-3","dim":"TT","title":"提供線下和線上多種學習選項與模式來完成學習任務。","note":"","new":false,"gamma":[],"cites":[],"key":"TT-4-3"},{"code":"TT-4-4","dim":"TT","title":"能持續與社群教師、家長和學生合作，為學生創造更多元的個人化學習體驗，提升混成學習(註3)和數位運用之學習綜效。","note":"整合SEL與學生多元需求，將具成效的設計整理為可共享的課程模組。","new":false,"gamma":[],"cites":[],"key":"TT-4-4"},{"code":"TT-4-5","dim":"TT","title":"能運用自適應學習(註2)(Personalized Adaptive Learning)平臺、學生學習的數據分析、生成式AI，持續精進教學策略。","note":"結合教師專業判斷檢視分析與AI建議，追蹤教學調整後的學習表現，於社群中校準與分享。","new":false,"gamma":[],"cites":["4-4，頁45、67至68"],"key":"TT-4-5"},{"code":"TT-4-6","dim":"TT","title":"能運用學生自適應學習(註2)(Personalized Adaptive Learning)平臺和數位軟體及數位工具，協助學生規劃、參與、和評估自己的學習。","note":"","new":false,"gamma":[],"cites":[],"key":"TT-4-6"},{"code":"AS-4-1","dim":"AS","title":"提供教師必要的數位工具，協助教師數據分析之專業增能，以評估學生的學習表現並調整教學策略。","note":"支持教師判讀資料品質與學習差異，促進以證據為本的課程改進。","new":false,"gamma":[],"cites":[],"key":"AS-4-1"},{"code":"AS-4-2","dim":"AS","title":"鼓勵教師參與教育科技研究和創新計畫，以發展新的教學方法和科技應用。","note":"","new":false,"gamma":[],"cites":[],"key":"AS-4-2"},{"code":"AS-4-3","dim":"AS","title":"維持親師溝通管道","note":"","new":false,"gamma":[],"cites":[],"key":"AS-4-3"},{"code":"AS-4-4","dim":"AS","title":"學校行政及學科教師能發展數位學習成效評估及調整機制。","note":"(鼓勵性)定期檢視跨年度學生學習、課程轉化及行政減量成效，依結果調整資源與發展目標；維持鼓勵性質。","new":false,"gamma":[],"cites":[],"key":"AS-4-4"},{"code":"AS-4-5","dim":"AS","title":"建立跨年度設備更新、授權維運與人力交接機制，透過區域共享、示範及陪伴支持其他學校，維持推動成果的持續性。","note":"","new":true,"gamma":[],"cites":[],"key":"AS-4-5"}],"refs":[{"code":"X2-7","text":"學校能長期關注數位發展趨勢於必要時更新數位環境與軟硬體設備。"},{"code":"X3-1","text":"學校能運用數位科技掌握教育發展趨勢，據以擬定與調整學校發展目標。"},{"code":"Z2-2","text":"教師能進行跨界、跨國共備與共授，提供學生課程選修的機會。"}]}],"a2":[{"n":0,"items":[{"code":"KR-0-1","dim":"KR","title":"決定成為開課學校或合作學校。","note":"並於跨校課程匯流平臺登錄課程或合作需求，確認兩校行政與教學窗口，說明各方課程實施及學生支持責任。","new":false,"gamma":[],"cites":["4-8，第4、5點"],"key":"KR-0-1"},{"code":"KR-0-2","dim":"KR","title":"溝通與確認開設課程內容及時段。","note":"協調行事曆、課程目標、學生起點及共備時段，並規劃非即時節數之學習安排（即時互動比例詳AS-0-5）；跨國合作另評估時差、語言與協調量能。","new":false,"gamma":[],"cites":[],"key":"KR-0-2"},{"code":"KR-0-3","dim":"KR","title":"確認參與學校之課程計畫是否各自取得課程代碼。","note":"依課程性質確認課程計畫、備查及跨校協議等適用程序。","new":false,"gamma":[],"cites":["4-7，第19條"],"key":"KR-0-3"},{"code":"KR-0-4","dim":"KR","title":"確認選課機制（含加退選）及其時間。","note":"共同訂定選課、加退選及名單異動的辦理時程與聯繫流程。","new":false,"gamma":[],"cites":[],"key":"KR-0-4"},{"code":"KR-0-5","dim":"KR","title":"確認線上課程管理數位學習平臺及其運作。","note":"兩端完成帳號權限、教材分享、連線與基本互動測試，確認支援及備援安排。","new":false,"gamma":[],"cites":[],"key":"KR-0-5"},{"code":"KR-0-6","dim":"KR","title":"完成雙師分工協議（開課學校任課教師／合作學校合作教師），明訂點名、成績對接、斷訊處理、學習評量協助、學習成果認證及學生狀況通報之權責。","note":"","new":true,"gamma":[],"cites":["4-8，第4、5、9點"],"key":"KR-0-6"},{"code":"KR-0-7","dim":"KR","title":"設計跨校修課學生之數據使用告知及AI使用規範說明，含家長知情同意。","note":"","new":true,"gamma":["γ-1、γ-2"],"cites":["4-5，第5至8點"],"key":"KR-0-7"},{"code":"KR-0-8","dim":"KR","title":"盤點課程將蒐集之學習數據（出席、作業繳交、平臺互動），約定兩校存取權限，僅交換教 ":"","new":true,"gamma":["γ-1"],"cites":["4-5，第5至8點"],"key":"AS-0-9"},{"code":"AS-0-10","dim":"AS","title":"透過跨校課程匯流平臺完成課程登錄與媒合，減少跨校聯繫往返，達到行政減量。","note":"","new":true,"gamma":[],"cites":[],"key":"AS-0-10"}],"refs":[{"code":"X1-1","text":"學校在數位環境增置足夠軟硬體設備(例如：網路……等)。"},{"code":"X1-2","text":"學校能增置足夠的教師教學軟硬體設備。"},{"code":"X1-3","text":"學校能增置足夠的學生學習軟硬體設備和行動載具。"},{"code":"X1-4","text":"學校為維護數位環境能列出檢核項目及時程安排。"},{"code":"X1-6","text":"學校設置專業人員解決複雜的網路與設備問題。"},{"code":"X2-1","text":"學校成立數位核心小組(成員包括校長、主任、學科領域召集人)。"},{"code":"X2-2","text":"學校數位核心小組能負責數位環境之規劃、全校性數位整體推動工作"},{"code":"X2-6","text":"學校能持續定期檢視並調整推動數位化之工作。"},{"code":"Y1-1","text":"學校能提供教師增能，解決一般教室網路與設備問題。"}]},{"n":1,"items":[{"code":"KR-1-1","dim":"KR","title":"成為開課學校或合作學校，開設或參與一門課程。","note":"依開課或合作角色完成約定工作，確認兩端學生均有參與及取得回饋的機會。","new":false,"gamma":[],"cites":[],"key":"KR-1-1"},{"code":"KR-1-2","dim":"KR","title":"教學環境能滿足師生遠距教與學的需求。","note":"透過兩端測試、問題回報及改善紀錄檢視障礙是否排除。","new":false,"gamma":[],"cites":[],"key":"KR-1-2"},{"code":"KR-1-3","dim":"KR","title":"課程內容順暢雙向(多向)傳遞。","note":"除連線順暢外，並以學生回應、提問與任務參與檢視互動品質。","new":false,"gamma":[],"cites":[],"key":"KR-1-3"},{"code":"KR-1-4","dim":"KR","title":"建立學生有效學習的確認系統。","note":"結合作品、課堂說明、實作及回饋確認個別理解，不只以登入或出席認定學習成效。","new":false,"gamma":[],"cites":["4-7，第2、4條"],"key":"KR-1-4"},{"code":"KR-1-5","dim":"KR","title":"建立課程基本學習數據紀錄（出席、作業繳交、平臺參與），每學期至少與合作學校共同檢視1次，作為調整教學之依據。","note":"","new":true,"gamma":["γ-2"],"cites":[],"key":"KR-1-5"},{"code":"KR-1-6","dim":"KR","title":"跨校修課學生（含加退選後新加入者）均完成數據使用告知與AI使用規範說明，並留存紀錄。","note":"","new":true,"gamma":["γ-1、γ-2"],"cites":[],"key":"KR-1-6"},{"code":"KR-1-7","dim":"KR","title":"運用AI提升備課能力與設計遠距課程教材，標註來源與引用，並查核內容正確性。","note":"","new":true,"gamma":["γ-1→α-2"],"cites":["4-5，第1至3點"],"key":"KR-1-7"},{"code":"EC-1-1","dim":"EC","title":"會運用設備提升遠距教學的聲音與影像品質(例如：指向式麥克風)。","note":"依兩端師生回饋改善音像品質，追蹤問題處理情形。","new":false,"gamma":[],"cites":[],"key":"EC-1-1"},{"code":"EC-1-2","dim":"EC","title":"會運用線上會議室與數位學習平臺，進行遠距教學活動。","note":"串連教材、任務及回饋，減少重複登入與繳交負擔。","new": /* ---------- 共用資料庫寫入 ---------- */
const docId = (plan,key)=>plan+"~"+key.replace("#",".");
const fromId = id=>{const i=id.indexOf("~");return {plan:id.slice(0,i),key:id.slice(i+1).replace(".","#")};};
// 寫入佇列：body 為 null 代表刪除；同一份文件一次只寫一筆且只送最新值，整體最多 4 筆同時進行
const pend = {}, queue = [], inflight = new Set(), dirty = new Set();
let active = 0;
function put(path,body){
  dirty.add(path);
  if(!(path in pend)&&!inflight.has(path)) queue.push(path);
  pend[path]={body}; pump();
}
function pump(){ while(active<4&&queue.length){const p=queue.shift(); if(p in pend) run(p);} }
async function run(path){
  active++; inflight.add(path);
  const {body}=pend[path]; delete pend[path];
  try{ body===null ? await db.doc(path).delete() : await db.doc(path).set(body); }
  catch(e){
    const c=e&&e.code;
    if(c==="invalid_argument"){canWrite=false;toast("你目前沒有寫入權限，已改為唯讀");render();}
    else if(c==="quota_exceeded") toast("資料庫已滿，無法再新增紀錄："+(e.message||""));
    else if(c==="revoked") toast("存取權限已變更，請重新整理頁面");
    else if(c==="permission-denied"||c==="unauthenticated"){canWrite=false;toast("你的帳號沒有寫入權限，已改為唯讀");render();}
    else toast("儲存失敗，請稍後再試一次");
  }
  inflight.delete(path); active--;
  if(path in pend) queue.push(path); else dirty.delete(path);
  pump();
}
const base = ()=>"schools/"+UI.sid;
const stamp = ()=>({by:myId,at:Date.now()});
function persist(){ if(MODE==="local") saveUI(); }

function setStatus(key,v){
  const d=D(), plan=UI.plan;
  if(v) d.status[plan][key]=v; else delete d.status[plan][key];
  if(shared()){d.meta[plan][key]=stamp(); put(`${base()}/status/${docId(plan,key)}`, v?{v,...stamp()}:null);}
  persist();
}
const noteTimers = {};
function setNote(key,text,immediate){
  const d=D(), plan=UI.plan;
  if(text===undefined) delete d.notes[plan][key]; else d.notes[plan][key]=text;
  persist();
  if(!shared()) return;
  const path=`${base()}/notes/${docId(plan,key)}`; dirty.add(path);
  clearTimeout(noteTimers[path]);
  const go=()=>put(path, text?{text,...stamp()}:null);
  if(immediate) go(); else noteTimers[path]=setTimeout(go,700);
}
const pickTimers = {};
function setPick(key,obj,immediate){
  const d=D(), plan=UI.plan;
  if(obj) d.picks[plan][key]=obj; else delete d.picks[plan][key];
  persist();
  if(!shared()) return;
  const path=`${base()}/picks/${docId(plan,key)}`; dirty.add(path);
  clearTimeout(pickTimers[path]);
  const go=()=>put(path, obj?{...obj,...stamp()}:null);
  if(immediate) go(); else pickTimers[path]=setTimeout(go,700);
}
let profTimer;
function setProfile(patch,immediate){
  Object.assign(D().profile,patch); persist();
  if(!shared()) return;
  const path=base(); dirty.add(path); clearTimeout(profTimer);
  const go=()=>put(path,{...D().profile,updatedAt:Date.now()});
  if(immediate) go(); else profTimer=setTimeout(go,700);
}

/* ---------- 共用資料庫讀取 ---------- */
let pendingRender=false;
function schedule(){
  const a=document.activeElement;
  if(a&&a.closest&&a.closest("#app")&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){pendingRender=true;return;}
  render();
}
document.addEventListener("focusout",()=>{if(pendingRender){pendingRender=false;setTimeout(schedule,0);}});
function dbError(e){
  if(e&&e.code==="revoked") toast("存取權限已變更，請重新整理頁面");
  else if(e&&e.code==="permission-denied") toast("你的帳號沒有讀取權限，請確認是用學校帳號登入");
}

function subscribeSchool(sid){
  schoolUnsubs.forEach(u=>u()); schoolUnsubs=[]; LIVE=blankData(); liveLoaded=false;
  if(!sid) return;
  let got=0;
  const ready=()=>{if(++got===4){liveLoaded=true;} schedule();};
  schoolUnsubs.push(db.doc("schools/"+sid).onSnapshot(s=>{
    if(!dirty.has("schools/"+sid)&&s.exists) LIVE.profile=Object.assign(blankData().profile,s.data());
    if(!s.exists&&!s.metadata.fromCache){UI.sid=null;saveUI();toast("這個學校工作區已不存在");}
    ready();
  },dbError));
  for(const c of ["status","notes","picks"]){
    let first=true;
    schoolUnsubs.push(db.collection(`schools/${sid}/${c}`).onSnapshot(qs=>{
      const fresh={a1:{},a2:{}}, meta={a1:{},a2:{}};
      for(const d of qs.docs){
        const {plan,key}=fromId(d.id), x=d.data(); if(!fresh[plan]) continue;
        if(c==="status"){fresh[plan][key]=x.v; meta[plan][key]={by:x.by,at:x.at};}
        else if(c==="notes") fresh[plan][key]=x.text;
        else fresh[plan][key]={owner:x.owner,when:x.when,evidence:x.evidence,action:x.action||""};
      }
      // 自己還沒寫完的欄位保留本機值，避免打字中被舊值蓋掉
      for(const plan of ["a1","a2"]) for(const k of Object.keys(LIVE[c][plan]))
        if(dirty.has(`schools/${sid}/${c}/${docId(plan,k)}`)) fresh[plan][k]=LIVE[c][plan][k];
      LIVE[c]=fresh; if(c==="status") LIVE.meta=meta;
      if(first){first=false;ready();} else schedule();
    },dbError));
  }
}
function chooseSchool(sid){UI.sid=sid;saveUI();subscribeSchool(sid);render();}
async function createSchool(name){
  name=name.trim(); if(!name){toast("請先輸入學校名稱");return;}
  if(schools.some(s=>s.name===name)){toast("已有同名的工作區，請直接點選它");return;}
  const ref=db.collection("schools").doc();
  try{
    await ref.set({...blankData().profile,name,createdBy:myId,createdAt:Date.now(),updatedAt:Date.now()});
    chooseSchool(ref.id); toast("已建立「"+name+"」工作區");
  }catch(e){ if(e&&(e.code==="invalid_argument"||e.code==="permission-denied")){canWrite=false;toast("你目前沒有寫入權限，無法建立工作區");render();} else toast("建立失敗，請稍後再試一次"); }
}
async function importInto(src){   // 把一份紀錄（本機舊資料或備份碼）寫進目前的學校工作區
  let n=0;
  if(src.profile&&!D().profile.name) setProfile({...src.profile,name:D().profile.name||src.profile.name},true);
  for(const plan of ["a1","a2"]){
    const keep=UI.plan; UI.plan=plan;
    for(const [k,v] of Object.entries((src.status||{})[plan]||{})){setStatus(k,v);n++;}
    for(const [k,v] of Object.entries((src.notes||{})[plan]||{})) if(v) setNote(k,v,true);
    for(const [k,v] of Object.entries((src.picks||{})[plan]||{})) setPick(k,v,true);
    UI.plan=keep;
  }
  render(); toast(`已匯入 ${n} 筆盤點紀錄`);
}

/* ---------- Firebase 後端（GitHub Pages 版）----------
   成員以學校 Google 帳號登入，紀錄存在 Firestore。
   Firestore compat 版的 doc/collection/set/delete/onSnapshot 與上面用到的介面相同；
   只有指定網域的帳號能讀寫，由 firestore.rules 在伺服器端把關。 */
const FB = (window.SAP_CONFIG&&window.SAP_CONFIG.firebase)||null;
const FB_DOMAIN = ((window.SAP_CONFIG&&window.SAP_CONFIG.allowedDomain)||"").toLowerCase();
let loginError = "", fbUser = null;
const fbReady = ()=>!!(FB&&FB.apiKey&&window.firebase);
function bootFirebase(){
  MODE="connecting"; render();
  firebase.initializeApp(FB);
  firebase.firestore().settings({ignoreUndefinedProperties:true});
  firebase.auth().onAuthStateChanged(u=>{
    if(!u){fbUser=null;MODE="needlogin";render();return;}
    const email=(u.email||"").toLowerCase();
    if(FB_DOMAIN&&!email.endsWith("@"+FB_DOMAIN)){
      loginError=`請改用 @${FB_DOMAIN} 的學校帳號登入（剛才登入的是 ${email}）。`;
      firebase.auth().signOut(); return;
    }
    fbUser=u; loginError=""; db=firebase.firestore(); myId=u.displayName||email; canWrite=true; BACKEND="firebase";
    startShared();
  });
}
async function login(){
  loginError="";
  const p=new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters(FB_DOMAIN?{hd:FB_DOMAIN,prompt:"select_account"}:{prompt:"select_account"});
  try{ await firebase.auth().signInWithPopup(p); }
  catch(e){
    const c=e&&e.code;
    if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-this-environment"){firebase.auth().signInWithRedirect(p);return;}
    if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request") return;
    loginError=c==="auth/unauthorized-domain"?"這個網址還沒加入 Firebase 的「授權網域」，請管理者在 Firebase 主控台加入。":"登入失敗："+((e&&e.message)||c);
    render();
  }
}
function logout(){ firebase.auth().signOut().then(()=>location.reload()); }

let BACKEND = "";                   // claude | firebase
function startShared(){
  MODE="db";
  db.collection("schools").onSnapshot(qs=>{
    schools=qs.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>String(a.name).localeCompare(String(b.name),"zh-Hant"));
    schedule();
  },dbError);

  render();
}
async function boot(){
  render();
  const c=window.claude;
  if(!c||typeof c.use!=="function"){
    if(fbReady()){bootFirebase();return;}
    MODE="local";render();return;
  }
  const [d,u]=await Promise.all([c.use("db"),c.use("user")]);
  user=u;
  if(!d){MODE="local";render();return;}
  db=d; myId=user?await user.id():null; BACKEND="claude";
  const cw=user?await user.can("data.write"):null; canWrite=cw!==false;
  startShared();
}

function gammaOptional(it){
  if(UI.plan!=="a2"||!it.gamma.length) return false;
  const g=it.gamma.join(" "), p=D().profile;
  return !((/γ-1/.test(g)&&p.g1)||(/γ-2/.test(g)&&p.g2));
}

/* ---------- 計分 ---------- */
function score(items){
  let sum=0,app=0,rated=0,tbd=0,na=0;
  for(const it of items){
    const v=st()[it.key]; if(!v) continue; rated++;
    if(v==="tbd"){tbd++;continue;} if(v==="na"){na++;continue;}
    app++; sum+=STATUS.find(s=>s.v===v).w;
  }
  return {total:items.length,rated,app,tbd,na,score:app?sum/app:null};
}
function verdict(stage){
  const all=score(stage.items), kr=score(stage.items.filter(i=>i.dim==="KR"));
  if(all.rated/all.total<.5) return {k:"unrated",l:"盤點未完成",all,kr};
  if(all.app===0) return {k:"na",l:"不適用",all,kr};
  if(all.score>=.7&&(kr.score===null||kr.score>=.8)) return {k:"stable",l:"已穩定",all,kr};
  if(all.score>=.35) return {k:"progress",l:"推進中",all,kr};
  return {k:"start",l:"起步中",all,kr};
}
function focusStage(){
  const list=stages();
  for(let i=0;i<list.length;i++){const v=verdict(list[i]); if(v.k!=="stable"&&v.k!=="na") return {i,v,allStable:false};}
  return {i:list.length-1,v:verdict(list[list.length-1]),allStable:true};
}

  return `<section class="view">

  <div class="verdict"><span class="label">${PLAN[UI.plan].name}${p.name?"・"+esc(p.name):""}・已盤點 ${total} / ${all} 項</span>${head}${hiNote}</div>

  L.push(`建議聚焦：${STAGE[UI.plan][f.i].t}・${STAGE[UI.plan][f.i].pos}`);
  L.push("");L.push("二、年度優先改善工作");
  const keys=Object.keys(picks).filter(findItem);
  if(!keys.length) L.push("（尚未選定）");
  keys.forEach((k,i)=>{const {it,stage}=findItem(k),q=picks[k];
    L.push(`${i+1}. ${it.code}（${STAGE[UI.plan][stage].t}・${DIM[it.dim].short}）${it.title}`);
    L.push(`   負責：${q.owner}｜期程：${q.when}｜佐證：${q.evidence}`);
    if(q.action) L.push(`   做法：${q.action}`);});
  L.push("");L.push("註：本診斷僅供校內盤點討論，不作排名；正式回報依核定表單辦理。");
  return L.join("\n");
}
async function copy(text,label){
  const out=$("#copyout");
  try{await navigator.clipboard.writeText(text);out.hidden=true;toast(label+"已複製");}
  catch(e){out.hidden=false;out.value=text;out.focus();out.select();toast("請按 Ctrl+C 複製選取的文字");}
}
function pick(key,on){
  if(on){const {it}=findItem(key);setPick(key,{owner:it.dim==="EC"?"總務處":it.dim==="SL"||it.dim==="TT"?"教務處":"數位核心小組",when:WHEN[2],evidence:EVID[it.dim],action:""},true);}
  else setPick(key,null,true);
}
function autoPick(){
  const {fs}=suggestions(); const picks=D().picks[UI.plan];
  const open=fs.items.filter(i=>["part","no"].includes(st()[i.key])&&!gammaOptional(i));
  const dimScore=d=>{const s=score(fs.items.filter(i=>i.dim===d)).score;return s===null?1:s;};
  open.sort((a,b)=>((a.dim==="KR"?-1:dimScore(a.dim))-(b.dim==="KR"?-1:dimScore(b.dim)))||((st()[a.key]==="part"?0:1)-(st()[b.key]==="part"?0:1)));
  let added=0; for(const it of open){if(Object.keys(picks).length>=5)break; if(!picks[it.key]){pick(it.key,true);added++;}}
  render(); toast(added?`已加入 ${added} 項`:"沒有可再加入的項目");
}

/* ---------- 事件 ---------- */
const app=$("#app");
app.addEventListener("click",e=>{
  const t=e.target.closest("button,input[type=checkbox]"); if(!t||t.disabled) return;
  if(t.dataset.plan){UI.plan=t.dataset.plan;UI.dim="all";saveUI();render();return;}
  if(t.dataset.sid){chooseSchool(t.dataset.sid);return;}
  if(t.id==="createSchool"){createSchool($("#newSchool").value);return;}
  if(t.id==="importLocal"){importInto(LOCAL);return;}
  if(t.id==="fbLogin"){login();return;}
  if(t.id==="fbLogout"){logout();return;}
  const seg=t.closest(".seg[data-group]"); if(seg&&t.dataset.val){if(!editable())return;setProfile({[seg.dataset.group]:t.dataset.val},true);render();return;}
  if(t.dataset.g){if(!editable())return;setProfile({[t.dataset.g]:!D().profile[t.dataset.g]},true);render();return;}
  if(t.dataset.stage!==undefined){UI.stage[UI.plan]=+t.dataset.stage;UI.dim="all";saveUI();render();window.scrollTo({top:0});return;}
  if(t.dataset.dim){UI.dim=t.dataset.dim;saveUI();render();return;}
  const item=t.closest(".item");
  if(item&&t.dataset.v){
    if(!editable()){toast("你目前只有檢視權限");return;}
    const k=item.dataset.key, nv=st()[k]===t.dataset.v?null:t.dataset.v;
    setStatus(k,nv); render(); return;}
  if(item&&t.hasAttribute("data-note")){
    if(!editable()) return;
    const k=item.dataset.key, n=D().notes[UI.plan];
    if(n[k]===undefined) n[k]=""; else if(!n[k]) setNote(k,undefined,true); else {toast("已有內容的註記會保留");return;}
    render(); return;}
  if(t.id==="naGamma"){const s=stages()[UI.stage[UI.plan]]; s.items.filter(gammaOptional).forEach(i=>setStatus(i.key,"na")); render(); toast("已標為不適用"); return;}
  if(t.dataset.pick){pick(t.dataset.pick,t.checked);render();return;}
  if(t.dataset.unpick){pick(t.dataset.unpick,false);render();return;}
  if(t.id==="autoPick"){autoPick();return;}
  if(t.id==="copyPlan"){copy(planText(),"方案文字");return;}
  if(t.id==="copyBackup"){const d=D();copy(JSON.stringify({v:2,data:{profile:d.profile,status:d.status,notes:d.notes,picks:d.picks}}),"備份碼");return;}
  if(t.id==="showRestore"){$("#restoreBox").hidden=!$("#restoreBox").hidden;return;}
  if(t.id==="doRestore"){
    let o; try{o=JSON.parse($("#restoreIn").value.trim());}catch(err){o=null;}
    const src=o&&(o.v===2?o.data:o.v===1&&o.data?{profile:{name:o.data.name||"",school:o.data.school,role:o.data.role,g1:o.data.g1,g2:o.data.g2},status:o.data.status,notes:o.data.notes,picks:o.data.picks}:null);
    if(!src||!src.status){toast("備份碼格式不正確，請確認是否完整貼上");return;}
    if(shared()) importInto(src); else {LOCAL=Object.assign(blankData(),src);saveUI();render();toast("已還原備份");}
    return;}
  if(t.id==="resetAll"){$("#resetBox").hidden=false;return;}
  if(t.id==="cancelReset"){$("#resetBox").hidden=true;return;}
  if(t.id==="doReset"){LOCAL=blankData();saveUI();render();toast("已清除");return;}
});
app.addEventListener("keydown",e=>{if(e.target.id==="newSchool"&&e.key==="Enter"){e.preventDefault();createSchool(e.target.value);}});
app.addEventListener("input",e=>{
  const t=e.target;
  if(!editable()) return;
  if(t.id==="schoolName"){setProfile({name:t.value});renderTop();return;}
  if(t.closest(".item")&&t.tagName==="TEXTAREA"){setNote(t.closest(".item").dataset.key,t.value);return;}
  const row=t.closest(".planrow");
  if(row&&t.dataset.f){const k=row.dataset.row, cur=Object.assign({},D().picks[UI.plan][k],{[t.dataset.f]:t.value}); setPick(k,cur,t.tagName==="SELECT");}
});

/* 依 id 顯示成員名稱與頭像（claude.ai 版名稱不存進資料庫；Firebase 版存的是登入帳號的顯示名稱） */
async function fillNames(){
  const me=$("#whoami"); if(me&&fbUser) me.textContent=`${fbUser.displayName||""}（${fbUser.email||""}）`;
  const els=[...app.querySelectorAll("[data-uid],[data-avatar]")]; if(!els.length) return;
  if(BACKEND==="firebase"){
    for(const el of els){ if(el.dataset.avatar) el.remove(); else el.textContent=el.dataset.uid===myId?"你":el.dataset.uid; }
    return;
  }
  if(!user) return;
  const ids=[...new Set(els.map(el=>el.dataset.uid||el.dataset.avatar))];
  const ps=await user.profiles(ids);
  for(const el of els){
    const p=ps[el.dataset.uid||el.dataset.avatar]; if(!p) continue;
    if(el.dataset.uid) el.textContent=p.isMe?"你":(p.name||"成員"); else el.src=p.avatarUrl;
  }
}

function render(){
  renderTop();
  app.classList.toggle("app-ro",!editable());
  app.innerHTML=[viewSetup,viewRead,viewDiag,viewPlan][UI.step]();
  fillNames();
}
boot();

</script>
